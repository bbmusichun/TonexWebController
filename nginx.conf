# Full nginx config used only for the sandbox preview (mounted at
# /etc/nginx/nginx.conf). The app itself is a plain static site, so nginx serves
# the bind-mounted repo directly and edits show up on refresh.
#
# The sandbox clone is root-owned with restrictive permissions, so the workers
# run as root to be able to read the bind-mounted static files.
user root;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # No caching, so source edits are visible immediately.
        add_header Cache-Control "no-store" always;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
